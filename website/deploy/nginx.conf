server {
    listen 80;
    listen [::]:80;
    server_name rmcl.richasy.net;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://rmcl.richasy.net$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rmcl.richasy.net;
    root /home/www/rmcl/current;
    index index.html;
    autoindex off;

    ssl_certificate /etc/letsencrypt/live/rmcl.richasy.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rmcl.richasy.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/rmcl.access.log;
    error_log /var/log/nginx/rmcl.error.log;
    charset utf-8;
    server_tokens off;
    etag on;
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml text/markdown;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location ~* \.map(?:/|$) {
        return 404;
    }

    location = /.well-known/microsoft-identity-association.json {
        alias /home/www/rmcl/verification/microsoft-identity-association.json;
        default_type application/json;
    }

    location ~ /\. {
        return 404;
    }

    location /_next/static/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options nosniff always;
    }
}
