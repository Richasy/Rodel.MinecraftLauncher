name: Package launcher

on:
  workflow_dispatch:
    inputs:
      version:
        description: Four-part MSIX version (fourth component must be 0)
        required: true
        default: '0.2611.0.0'
        type: string
      artifacts:
        description: Package outputs only; never submit to Microsoft Store
        required: true
        default: Both
        type: choice
        options:
          - Both
          - Sideload
          - Store
      architecture:
        description: Native package architecture; Both builds separate x64 and ARM64 packages
        required: true
        default: Both
        type: choice
        options:
          - Both
          - x64
          - arm64
      validation_run_id:
        description: Optional existing package run ID; only rerun native validation without rebuilding
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ inputs.validation_run_id != '' && format('launcher-runtime-{0}-{1}', inputs.validation_run_id, inputs.architecture) || 'launcher-packaging' }}
  cancel-in-progress: false

jobs:
  package:
    if: ${{ inputs.validation_run_id == '' }}
    name: Build ${{ matrix.architecture }} ${{ matrix.distribution.artifacts }}
    runs-on: [self-hosted, Windows, X64, rodel-minecraftlauncher-build]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        architecture: ${{ fromJSON(inputs.architecture == 'arm64' && '["arm64"]' || inputs.architecture == 'x64' && '["x64"]' || '["arm64","x64"]') }}
        distribution: >-
          ${{ fromJSON(inputs.artifacts == 'Sideload'
            && '[{"artifacts":"Sideload","directory":"sideload-test"}]'
            || inputs.artifacts == 'Store'
            && '[{"artifacts":"Store","directory":"store"}]'
            || '[{"artifacts":"Sideload","directory":"sideload-test"},{"artifacts":"Store","directory":"store"}]') }}
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_ARTIFACTS: ${{ matrix.distribution.artifacts }}
      RELEASE_ARCHITECTURE: ${{ matrix.architecture }}
      RODEL_MICROSOFT_CLIENT_ID: ${{ secrets.RODEL_MICROSOFT_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require the approved Microsoft OAuth application
        run: |
          $id = [guid]::Empty
          if (-not [guid]::TryParse($env:RODEL_MICROSOFT_CLIENT_ID, [ref]$id) -or $id -eq [guid]::Empty) {
            throw 'Configure the RODEL_MICROSOFT_CLIENT_ID Actions secret before packaging.'
          }
      - uses: actions/setup-dotnet@v5
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}\dotnet
        with:
          global-json-file: global.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Prepare isolated pinned Rust for the ARM64 filesystem MCP
        if: matrix.architecture == 'arm64'
        run: |
          $env:CARGO_HOME = Join-Path $env:RUNNER_TOOL_CACHE 'rodel-cargo'
          $env:RUSTUP_HOME = Join-Path $env:RUNNER_TOOL_CACHE 'rodel-rustup'
          $rustup = Join-Path $env:CARGO_HOME 'bin\rustup.exe'
          if (-not (Test-Path -LiteralPath $rustup)) {
            $installer = Join-Path $env:RUNNER_TEMP 'rustup-init.exe'
            Invoke-WebRequest 'https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-pc-windows-msvc/rustup-init.exe' -OutFile $installer
            & $installer -y --no-modify-path --default-toolchain none --profile minimal
            if ($LASTEXITCODE -ne 0) { throw 'Isolated rustup installation failed.' }
          }
          & $rustup toolchain install 1.89.0 --profile minimal --target aarch64-pc-windows-msvc --no-self-update
          if ($LASTEXITCODE -ne 0) { throw 'Pinned ARM64 Rust toolchain installation failed.' }
          "CARGO_HOME=$env:CARGO_HOME" | Add-Content $env:GITHUB_ENV
          "RUSTUP_HOME=$env:RUSTUP_HOME" | Add-Content $env:GITHUB_ENV
          (Join-Path $env:CARGO_HOME 'bin') | Add-Content $env:GITHUB_PATH
      - name: Build and audit packages
        env:
          SPROUT_AZURE_READ_PAT: ${{ secrets.SPROUT_AZURE_READ_PAT }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SPROUT_AZURE_READ_PAT)) {
            throw 'Configure the SPROUT_AZURE_READ_PAT Actions secret with Packaging Read access to the private Sprout feed.'
          }
          $env:NuGetPackageSourceCredentials_sprout = "Username=build;Password=$env:SPROUT_AZURE_READ_PAT;ValidAuthenticationTypes=Basic"
          [Environment]::SetEnvironmentVariable('ORG_GRADLE_PROJECT_org.gradle.java.installations.fromEnv', 'JAVA_HOME_8_X64,JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64')
          .\scripts\package-release.ps1 `
            -Version $env:RELEASE_VERSION `
            -Artifacts $env:RELEASE_ARTIFACTS `
            -Architectures $env:RELEASE_ARCHITECTURE `
            -IncludeValidationAssets:($env:RELEASE_ARTIFACTS -eq 'Sideload') `
            -JavaHome $env:JAVA_HOME_25_X64 `
            -LegacyJavaHome $env:JAVA_HOME_21_X64 `
            -ObservationJavaHome $env:JAVA_HOME_8_X64
      - name: Upload packages and audits
        if: matrix.distribution.artifacts == 'Sideload'
        uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ inputs.version }}-win-${{ matrix.architecture }}-${{ matrix.distribution.artifacts }}
          path: |
            artifacts/release/${{ inputs.version }}/win-${{ matrix.architecture }}/${{ matrix.distribution.directory }}/*.msix
            artifacts/release/${{ inputs.version }}/win-${{ matrix.architecture }}/${{ matrix.distribution.directory }}/*.msixupload
            artifacts/release/${{ inputs.version }}/win-${{ matrix.architecture }}/${{ matrix.distribution.directory }}/*.cer
            artifacts/release/${{ inputs.version }}/win-${{ matrix.architecture }}/${{ matrix.distribution.directory }}/*.ps1
            artifacts/release/${{ inputs.version }}/win-${{ matrix.architecture }}/${{ matrix.distribution.directory }}/*.audit.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload separate runtime validation assets
        if: matrix.distribution.artifacts == 'Sideload'
        uses: actions/upload-artifact@v4
        with:
          name: launcher-runtime-${{ inputs.version }}-win-${{ matrix.architecture }}
          path: |
            artifacts/release/${{ inputs.version }}/win-${{ matrix.architecture }}/validation/
            !artifacts/release/${{ inputs.version }}/win-${{ matrix.architecture }}/validation/**/*.pdb
          if-no-files-found: error
          retention-days: 7

  verify-runtime:
    name: Run native ${{ matrix.architecture }}
    needs: package
    if: ${{ always() && !cancelled() && (inputs.artifacts != 'Store' || inputs.validation_run_id != '') }}
    runs-on: ${{ matrix.architecture == 'arm64' && 'windows-11-arm' || 'windows-2025' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        architecture: ${{ fromJSON(inputs.architecture == 'arm64' && '["arm64"]' || inputs.architecture == 'x64' && '["x64"]' || '["arm64","x64"]') }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v4
        with:
          name: launcher-${{ inputs.version }}-win-${{ matrix.architecture }}-Sideload
          path: artifacts\package
          github-token: ${{ github.token }}
          run-id: ${{ inputs.validation_run_id || github.run_id }}
      - uses: actions/download-artifact@v4
        with:
          name: launcher-runtime-${{ inputs.version }}-win-${{ matrix.architecture }}
          path: artifacts\runtime
          github-token: ${{ github.token }}
          run-id: ${{ inputs.validation_run_id || github.run_id }}
      - name: Run actual native CLI and MCP protocols
        env:
          RELEASE_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          $expected = if ($env:RELEASE_ARCHITECTURE -eq 'arm64') { 'Arm64' } else { 'X64' }
          if ([Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString() -ne $expected) {
            throw "Expected a real $expected Windows host, not cross-compilation or emulation-only evidence."
          }
          & artifacts\runtime\cli\rodel-mc.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'NativeAOT CLI did not start.' }
          $data = Join-Path $env:RUNNER_TEMP ('launcher-native-' + [guid]::NewGuid().ToString('N'))
          $payload = Join-Path $env:RUNNER_TEMP ('launcher-msix-' + [guid]::NewGuid().ToString('N'))
          try {
            $package = @(Get-ChildItem artifacts\package -Filter '*.msix' -File)
            if ($package.Count -ne 1) { throw 'Expected one exact MSIX for native MCP validation.' }
            [IO.Compression.ZipFile]::ExtractToDirectory($package[0].FullName, $payload)
            $env:RODEL_TEST_RELEASE_ROOT = $payload
            $output = & artifacts\runtime\cli\rodel-mc.exe --data-dir $data --json instance list | Out-String
            if ($LASTEXITCODE -ne 0) { throw 'NativeAOT instance inventory failed.' }
            $result = $output | ConvertFrom-Json
            if ($result.status -ne 'succeeded') { throw 'NativeAOT Core did not return a successful inventory.' }
            & artifacts\runtime\tests\Rodel.MinecraftLauncher.Assistant.Tests.exe `
              --filter 'FullyQualifiedName~ManagedPackageTests|FullyQualifiedName~ReleaseNativeTests' `
              --report-trx --results-directory artifacts\evidence\tests
            if ($LASTEXITCODE -ne 0) { throw 'Native MCP or package regression failed.' }
          }
          finally {
            if (Test-Path -LiteralPath $data) { Remove-Item -LiteralPath $data -Recurse -Force }
            if (Test-Path -LiteralPath $payload) { Remove-Item -LiteralPath $payload -Recurse -Force }
          }
      - name: Install pinned Sprout DevTools
        env:
          SPROUT_AZURE_READ_PAT: ${{ secrets.SPROUT_AZURE_READ_PAT }}
        run: |
          $env:NuGetPackageSourceCredentials_sprout = "Username=build;Password=$env:SPROUT_AZURE_READ_PAT;ValidAuthenticationTypes=Basic"
          dotnet tool install Sprout.DevTools --version 0.0.0-preview0029 `
            --tool-path "$env:RUNNER_TEMP\sprout-tools" `
            --add-source https://www.nuget.org/api/v2/
          if ($LASTEXITCODE -ne 0) { throw 'Sprout DevTools installation failed.' }
      - name: Verify the exact signed package in the hosted Windows VM
        run: |
          $package = @(Get-ChildItem artifacts\package -Filter '*.msix' -File)
          $cert = @(Get-ChildItem artifacts\package -Filter '*.cer' -File)
          if ($package.Count -ne 1 -or $cert.Count -ne 1) { throw 'Expected one exact signed MSIX and public certificate.' }
          & "$env:RUNNER_TEMP\sprout-tools\sprout-devtools.exe" drive Rodel.MinecraftLauncher.App.exe `
            --packaged --install signed --msix $package[0].FullName --cert $cert[0].FullName `
            --script test\release-runtime.drive.json --require-cleanup --timeout-ms 120000 `
            --crash-metadata --artifacts artifacts\evidence\app --json
          if ($LASTEXITCODE -ne 0) { throw 'Packaged native App UIA validation failed.' }
      - name: Upload runtime evidence, separate from player packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launcher-evidence-${{ inputs.version }}-win-${{ matrix.architecture }}
          path: artifacts/evidence/
          if-no-files-found: warn
          retention-days: 14
