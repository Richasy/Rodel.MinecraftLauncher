name: Package EXE installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: Four-part version ending in .0; blank uses the App project version
        required: false
        default: ''
        type: string
      x64:
        description: Build the x64 installer
        required: true
        default: true
        type: boolean
      arm64:
        description: Build the ARM64 installer
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: launcher-packaging
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    name: Select installer targets
    runs-on: [self-hosted, Windows, X64, rodel-minecraftlauncher-build]
    timeout-minutes: 10
    outputs:
      architectures: ${{ steps.targets.outputs.architectures }}
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    env:
      RODEL_MICROSOFT_CLIENT_ID: ${{ secrets.RODEL_MICROSOFT_CLIENT_ID }}
    steps:
      - name: Require at least one architecture
        id: targets
        env:
          BUILD_X64: ${{ inputs.x64 }}
          BUILD_ARM64: ${{ inputs.arm64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $architectures = @()
          if ($env:BUILD_X64 -ceq 'true') { $architectures += 'x64' }
          if ($env:BUILD_ARM64 -ceq 'true') { $architectures += 'arm64' }
          if ($architectures.Count -eq 0) { throw 'Select at least one installer architecture.' }
          $matrix = ConvertTo-Json -InputObject $architectures -Compress
          "architectures=$matrix" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve the installer version and require Microsoft login configuration
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:INPUT_VERSION
          if ([string]::IsNullOrWhiteSpace($version)) {
            [xml]$project = Get-Content -LiteralPath 'src/Rodel.MinecraftLauncher.App/Rodel.MinecraftLauncher.App.csproj' -Raw
            $version = $project.SelectSingleNode('/Project/PropertyGroup/SproutAppxVersion').InnerText
          }
          if ($version -cnotmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)\.0$' -or
              @($version.Split('.') | Where-Object { [long]$_ -gt 65535 }).Count) {
            throw 'Supply a canonical four-part UInt16 version ending in .0.'
          }
          $clientId = [guid]::Empty
          if (-not [guid]::TryParse($env:RODEL_MICROSOFT_CLIENT_ID, [ref]$clientId) -or $clientId -eq [guid]::Empty) {
            throw 'Configure the RODEL_MICROSOFT_CLIENT_ID Actions secret before packaging.'
          }
          "version=$version" >> $env:GITHUB_OUTPUT

  package:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        architecture: ${{ fromJSON(needs.plan.outputs.architectures) }}
    if: github.ref == 'refs/heads/main'
    name: Build ${{ matrix.architecture }} EXE
    runs-on: [self-hosted, Windows, X64, rodel-minecraftlauncher-build]
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_ARCHITECTURE: ${{ matrix.architecture }}
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      RODEL_MICROSOFT_CLIENT_ID: ${{ secrets.RODEL_MICROSOFT_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}\dotnet
        with:
          global-json-file: global.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Prepare isolated pinned Rust for the ARM64 filesystem MCP
        if: matrix.architecture == 'arm64'
        run: |
          $env:CARGO_HOME = Join-Path $env:RUNNER_TOOL_CACHE 'rodel-cargo'
          $env:RUSTUP_HOME = Join-Path $env:RUNNER_TOOL_CACHE 'rodel-rustup'
          $rustup = Join-Path $env:CARGO_HOME 'bin\rustup.exe'
          if (-not (Test-Path -LiteralPath $rustup)) {
            $installer = Join-Path $env:RUNNER_TEMP 'rustup-init.exe'
            Invoke-WebRequest 'https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-pc-windows-msvc/rustup-init.exe' -OutFile $installer
            & $installer -y --no-modify-path --default-toolchain none --profile minimal
            if ($LASTEXITCODE -ne 0) { throw 'Isolated rustup installation failed.' }
          }
          & $rustup toolchain install 1.89.0 --profile minimal --target aarch64-pc-windows-msvc --no-self-update
          if ($LASTEXITCODE -ne 0) { throw 'Pinned ARM64 Rust installation failed.' }
          "CARGO_HOME=$env:CARGO_HOME" >> $env:GITHUB_ENV
          "RUSTUP_HOME=$env:RUSTUP_HOME" >> $env:GITHUB_ENV
          (Join-Path $env:CARGO_HOME 'bin') >> $env:GITHUB_PATH
      - name: Prepare pinned Inno Setup compiler
        run: |
          $ErrorActionPreference = 'Stop'
          $directory = Join-Path $env:RUNNER_TOOL_CACHE 'rmcl-inno-setup\7.1.1'
          $compiler = Join-Path $directory 'ISCC.exe'
          $installed = Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 7\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler) -and (Test-Path -LiteralPath $installed)) {
            $installedVersion = & $installed --version
            if ($LASTEXITCODE -eq 0 -and ([string]$installedVersion).Trim() -ceq '7.1.1') {
              $compiler = $installed
            }
          }
          if (-not (Test-Path -LiteralPath $compiler)) {
            $installer = Join-Path $env:RUNNER_TEMP ('innosetup-' + [guid]::NewGuid().ToString('N') + '.exe')
            Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe' -OutFile $installer
            $expected = '8a5a6711c3766a6e5fb74f280ba0e3551e719ce94538d901fdbd1f8f9920b3f0'
            if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expected) {
              throw 'Inno Setup installer SHA256 mismatch.'
            }
            $process = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/CURRENTUSER', '/NOICONS', "/DIR=`"$directory`"") -WindowStyle Hidden -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Inno Setup installation failed ($($process.ExitCode))." }
          }
          $version = & $compiler --version
          if ($LASTEXITCODE -ne 0 -or ([string]$version).Trim() -cne '7.1.1') {
            throw 'Expected the pinned Inno Setup 7.1.1 compiler.'
          }
          "INNO_SETUP_COMPILER=$compiler" >> $env:GITHUB_ENV
      - name: Build the independent NativeAOT installer
        env:
          SPROUT_AZURE_READ_PAT: ${{ secrets.SPROUT_AZURE_READ_PAT }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:SPROUT_AZURE_READ_PAT)) {
            throw 'Configure the SPROUT_AZURE_READ_PAT Actions secret with Packaging Read access.'
          }
          $env:NuGetPackageSourceCredentials_sprout = "Username=build;Password=$env:SPROUT_AZURE_READ_PAT;ValidAuthenticationTypes=Basic"
          [Environment]::SetEnvironmentVariable('ORG_GRADLE_PROJECT_org.gradle.java.installations.fromEnv', 'JAVA_HOME_8_X64,JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64')
          .\scripts\package-exe.ps1 -Version $env:RELEASE_VERSION -Architecture $env:RELEASE_ARCHITECTURE `
            -Compiler $env:INNO_SETUP_COMPILER -JavaHome $env:JAVA_HOME_25_X64 `
            -LegacyJavaHome $env:JAVA_HOME_21_X64 -ObservationJavaHome $env:JAVA_HOME_8_X64
      - name: Upload the installer and SHA256 checksum
        uses: actions/upload-artifact@v4
        with:
          name: rmcl-${{ needs.plan.outputs.version }}-win-${{ matrix.architecture }}-exe
          path: |
            artifacts/release/${{ needs.plan.outputs.version }}/win-${{ matrix.architecture }}/exe/RMCL-${{ needs.plan.outputs.version }}-win-${{ matrix.architecture }}-setup.exe
            artifacts/release/${{ needs.plan.outputs.version }}/win-${{ matrix.architecture }}/exe/RMCL-${{ needs.plan.outputs.version }}-win-${{ matrix.architecture }}-setup.exe.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
