name: Release EXE installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: Four-part version ending in .0; blank uses the App project version
        required: false
        default: ''
        type: string
      publish:
        description: Publish a stable GitHub Release (main and both architectures required)
        required: true
        default: true
        type: boolean
      x64:
        description: Build the x64 installer
        required: true
        default: true
        type: boolean
      arm64:
        description: Build the ARM64 installer
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: launcher-packaging
  cancel-in-progress: false

jobs:
  plan:
    name: Select installer targets
    runs-on: [self-hosted, Windows, X64, rodel-minecraftlauncher-build]
    timeout-minutes: 10
    outputs:
      architectures: ${{ steps.targets.outputs.architectures }}
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    env:
      RODEL_MICROSOFT_CLIENT_ID: ${{ secrets.RODEL_MICROSOFT_CLIENT_ID }}
    steps:
      - name: Require at least one architecture
        id: targets
        env:
          BUILD_X64: ${{ inputs.x64 }}
          BUILD_ARM64: ${{ inputs.arm64 }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          $ErrorActionPreference = 'Stop'
          $architectures = @()
          if ($env:BUILD_X64 -ceq 'true') { $architectures += 'x64' }
          if ($env:BUILD_ARM64 -ceq 'true') { $architectures += 'arm64' }
          if ($architectures.Count -eq 0) { throw 'Select at least one installer architecture.' }
          if ($env:PUBLISH -ceq 'true' -and ($env:GITHUB_REF -cne 'refs/heads/main' -or $architectures.Count -ne 2)) {
            throw 'Stable releases require main and both x64/ARM64 installers. Disable publish for branch validation.'
          }
          $matrix = ConvertTo-Json -InputObject $architectures -Compress
          "architectures=$matrix" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve the installer version and require Microsoft login configuration
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:INPUT_VERSION
          if ([string]::IsNullOrWhiteSpace($version)) {
            [xml]$project = Get-Content -LiteralPath 'src/Rodel.MinecraftLauncher.App/Rodel.MinecraftLauncher.App.csproj' -Raw
            $version = $project.SelectSingleNode('/Project/PropertyGroup/SproutAppxVersion').InnerText
          }
          if ($version -cnotmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)\.0$' -or
              @($version.Split('.') | Where-Object { [long]$_ -gt 65535 }).Count) {
            throw 'Supply a canonical four-part UInt16 version ending in .0.'
          }
          $clientId = [guid]::Empty
          if (-not [guid]::TryParse($env:RODEL_MICROSOFT_CLIENT_ID, [ref]$clientId) -or $clientId -eq [guid]::Empty) {
            throw 'Configure the RODEL_MICROSOFT_CLIENT_ID Actions secret before packaging.'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          $releases = & gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect existing release versions.' }
          if (@($releases | Where-Object { $_.tag_name -ceq "v$version" }).Count) { throw 'This release tag already exists; never overwrite a release or partial draft.' }
          $tags = & gh api "repos/$env:GITHUB_REPOSITORY/git/matching-refs/tags/v$version" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect existing source tags.' }
          if (@($tags | Where-Object { $_.ref -ceq "refs/tags/v$version" }).Count) { throw 'The target tag already exists; never reuse an unbound source tag.' }
          $latest = $releases | Where-Object { -not $_.draft -and -not $_.prerelease -and $_.tag_name -cmatch '^v\d+\.\d+\.\d+\.0$' } |
            Sort-Object { [version]$_.tag_name.Substring(1) } -Descending | Select-Object -First 1
          if ($env:PUBLISH -ceq 'true' -and $latest -and [version]$version -le [version]$latest.tag_name.Substring(1)) { throw 'The version must be newer than the published stable release.' }

  package:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        architecture: ${{ fromJSON(needs.plan.outputs.architectures) }}
    name: Build ${{ matrix.architecture }} EXE
    runs-on: [self-hosted, Windows, X64, rodel-minecraftlauncher-build]
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_ARCHITECTURE: ${{ matrix.architecture }}
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      RODEL_MICROSOFT_CLIENT_ID: ${{ secrets.RODEL_MICROSOFT_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}\dotnet
        with:
          global-json-file: global.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Prepare isolated pinned Rust for the ARM64 filesystem MCP
        if: matrix.architecture == 'arm64'
        run: |
          $env:CARGO_HOME = Join-Path $env:RUNNER_TOOL_CACHE 'rodel-cargo'
          $env:RUSTUP_HOME = Join-Path $env:RUNNER_TOOL_CACHE 'rodel-rustup'
          $rustup = Join-Path $env:CARGO_HOME 'bin\rustup.exe'
          if (-not (Test-Path -LiteralPath $rustup)) {
            $installer = Join-Path $env:RUNNER_TEMP 'rustup-init.exe'
            Invoke-WebRequest 'https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-pc-windows-msvc/rustup-init.exe' -OutFile $installer
            & $installer -y --no-modify-path --default-toolchain none --profile minimal
            if ($LASTEXITCODE -ne 0) { throw 'Isolated rustup installation failed.' }
          }
          & $rustup toolchain install 1.89.0 --profile minimal --target aarch64-pc-windows-msvc --no-self-update
          if ($LASTEXITCODE -ne 0) { throw 'Pinned ARM64 Rust installation failed.' }
          "CARGO_HOME=$env:CARGO_HOME" >> $env:GITHUB_ENV
          "RUSTUP_HOME=$env:RUSTUP_HOME" >> $env:GITHUB_ENV
          (Join-Path $env:CARGO_HOME 'bin') >> $env:GITHUB_PATH
      - name: Prepare pinned Inno Setup compiler
        run: |
          $ErrorActionPreference = 'Stop'
          $directory = Join-Path $env:RUNNER_TOOL_CACHE 'rmcl-inno-setup\7.1.1'
          $compiler = Join-Path $directory 'ISCC.exe'
          $installed = Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 7\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler) -and (Test-Path -LiteralPath $installed)) {
            $installedVersion = & $installed --version
            if ($LASTEXITCODE -eq 0 -and ([string]$installedVersion).Trim() -ceq '7.1.1') {
              $compiler = $installed
            }
          }
          if (-not (Test-Path -LiteralPath $compiler)) {
            $installer = Join-Path $env:RUNNER_TEMP ('innosetup-' + [guid]::NewGuid().ToString('N') + '.exe')
            Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe' -OutFile $installer
            $expected = '8a5a6711c3766a6e5fb74f280ba0e3551e719ce94538d901fdbd1f8f9920b3f0'
            if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expected) {
              throw 'Inno Setup installer SHA256 mismatch.'
            }
            $process = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/CURRENTUSER', '/NOICONS', "/DIR=`"$directory`"") -WindowStyle Hidden -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Inno Setup installation failed ($($process.ExitCode))." }
          }
          $version = & $compiler --version
          if ($LASTEXITCODE -ne 0 -or ([string]$version).Trim() -cne '7.1.1') {
            throw 'Expected the pinned Inno Setup 7.1.1 compiler.'
          }
          "INNO_SETUP_COMPILER=$compiler" >> $env:GITHUB_ENV
      - name: Build the independent NativeAOT installer
        env:
          SPROUT_AZURE_READ_PAT: ${{ secrets.SPROUT_AZURE_READ_PAT }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:SPROUT_AZURE_READ_PAT)) {
            throw 'Configure the SPROUT_AZURE_READ_PAT Actions secret with Packaging Read access.'
          }
          $env:NuGetPackageSourceCredentials_sprout = "Username=build;Password=$env:SPROUT_AZURE_READ_PAT;ValidAuthenticationTypes=Basic"
          [Environment]::SetEnvironmentVariable('ORG_GRADLE_PROJECT_org.gradle.java.installations.fromEnv', 'JAVA_HOME_8_X64,JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64')
          .\scripts\package-exe.ps1 -Version $env:RELEASE_VERSION -Architecture $env:RELEASE_ARCHITECTURE `
            -Compiler $env:INNO_SETUP_COMPILER -JavaHome $env:JAVA_HOME_25_X64 `
            -LegacyJavaHome $env:JAVA_HOME_21_X64 -ObservationJavaHome $env:JAVA_HOME_8_X64
      - name: Upload the installer and SHA256 checksum
        uses: actions/upload-artifact@v4
        with:
          name: rmcl-${{ needs.plan.outputs.version }}-win-${{ matrix.architecture }}-exe
          path: |
            artifacts/release/${{ needs.plan.outputs.version }}/win-${{ matrix.architecture }}/exe/RMCL-${{ needs.plan.outputs.version }}-win-${{ matrix.architecture }}-setup.exe
            artifacts/release/${{ needs.plan.outputs.version }}/win-${{ matrix.architecture }}/exe/RMCL-${{ needs.plan.outputs.version }}-win-${{ matrix.architecture }}-setup.exe.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Generate localized manifest and publish
    needs: [plan, package]
    if: inputs.x64 && inputs.arm64
    runs-on: [self-hosted, Windows, X64, rodel-minecraftlauncher-build]
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: rmcl-${{ needs.plan.outputs.version }}-win-*-exe
          path: artifacts/github-release
          merge-multiple: true
      - name: Generate the source-bound fifteen-language release manifest
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE 'artifacts\github-release'
          .\scripts\generate-release-manifest.ps1 -Version $env:RELEASE_VERSION -AssetDirectory $root `
            -NotesPath (Join-Path $env:GITHUB_WORKSPACE '.github\release-notes.json') -OutputPath (Join-Path $root 'release-note.json')
      - uses: actions/upload-artifact@v4
        with:
          name: rmcl-${{ needs.plan.outputs.version }}-release
          path: artifacts/github-release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Publish complete release only after every asset is attached
        if: inputs.publish
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:GITHUB_WORKSPACE 'artifacts\github-release'
          $manifest = Get-Content -LiteralPath (Join-Path $root 'release-note.json') -Raw | ConvertFrom-Json
          if ($manifest.sourceCommit -cne $env:GITHUB_SHA) { throw 'Release source mismatch.' }
          $notes = Join-Path $env:RUNNER_TEMP ("rmcl-notes-" + $env:GITHUB_RUN_ID + '.txt')
          [IO.File]::WriteAllText($notes, $manifest.notes.en + "`n`n" + $manifest.notes.'zh-CN')
          try {
            $assets = @((Join-Path $root 'release-note.json'))
            foreach ($architecture in @('x64', 'arm64')) {
              $installer = Join-Path $root "RMCL-$env:RELEASE_VERSION-win-$architecture-setup.exe"
              $assets += $installer
              $assets += "$installer.sha256"
            }
            & gh api -X POST "repos/$env:GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/v$env:RELEASE_VERSION" -f "sha=$env:GITHUB_SHA" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Cannot create the exact source tag; inspect the tag before retrying.' }
            & gh release create "v$env:RELEASE_VERSION" @assets --draft --verify-tag --target $env:GITHUB_SHA `
              --title "RMCL $env:RELEASE_VERSION" --notes-file $notes
            if ($LASTEXITCODE -ne 0) { throw 'Draft creation/upload failed. Inspect the exact draft; do not overwrite or automatically replay publication.' }
            $tag = & gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/v$env:RELEASE_VERSION" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $tag.object.sha -cne $env:GITHUB_SHA) { throw 'The release tag does not point to the exact build source.' }
            $releaseId = & gh release view "v$env:RELEASE_VERSION" --json databaseId --jq '.databaseId'
            if ($LASTEXITCODE -ne 0 -or -not $releaseId) { throw 'Cannot resolve the exact draft release.' }
            $draft = & gh api "repos/$env:GITHUB_REPOSITORY/releases/$releaseId" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or -not $draft.draft -or $draft.assets.Count -ne $assets.Count) { throw 'The draft does not contain the complete release.' }
            foreach ($path in $assets) {
              $file = Get-Item -LiteralPath $path
              $attached = @($draft.assets | Where-Object name -CEQ $file.Name)
              if ($attached.Count -ne 1 -or $attached[0].size -ne $file.Length) { throw "Release asset mismatch: $($file.Name)" }
              if ($attached[0].digest -and $attached[0].digest -cne ('sha256:' + (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant())) {
                throw "Release asset digest mismatch: $($file.Name)"
              }
            }
            & gh release edit "v$env:RELEASE_VERSION" --draft=false --latest
            if ($LASTEXITCODE -ne 0) { throw 'Release publication result is unknown; inspect the exact tag before retrying.' }
          }
          finally { [IO.File]::Delete($notes) }
