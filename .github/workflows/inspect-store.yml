name: Inspect Store submission

on:
  workflow_dispatch:
    inputs:
      submission_id:
        description: Exact draft ID from a release receipt; read-only, never resubmits
        required: false
        default: ''
        type: string
      release_run:
        description: Optional original runId-attempt; finish only its GitHub Release after read-only Store confirmation
        required: false
        default: ''
        type: string
      receipt_only:
        description: Read only the retained receipt for release_run; no Store or GitHub writes
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  read-receipt:
    if: inputs.receipt_only
    runs-on: [self-hosted, Windows, X64, rodel-minecraftlauncher-build]
    concurrency:
      group: launcher-packaging
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read the exact release receipt without replaying delivery
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN: ${{ inputs.release_run }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_RUN -cnotmatch '^([1-9]\d*)-([1-9]\d*)$') { throw 'Supply the exact runId-attempt from the original release.' }
          $runId = $Matches[1]
          $attempt = $Matches[2]
          $root = Join-Path $env:RUNNER_WORKSPACE "launcher-store-releases\$env:RELEASE_RUN"
          $receipt = Get-Content "$root\store-receipt.json" -Raw | ConvertFrom-Json
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; 'X-GitHub-Api-Version' = '2022-11-28' }
          $run = Invoke-RestMethod -Uri "https://api.github.com/repos/Richasy/Rodel.MinecraftLauncher/actions/runs/$runId/attempts/$attempt" `
            -Headers $headers -MaximumRedirection 0
          if ($run.path -cne '.github/workflows/release-store.yml' -or $run.head_branch -cne 'main' -or
              $run.status -cne 'completed' -or $run.head_sha -cne $receipt.sourceCommit) {
            throw 'The completed original workflow and exact source must match the retained receipt.'
          }
          $receipt | Select-Object version, sourceCommit, phase, submissionId, commitRequested, committed, status, accepted, published, displayName, packagesVerified, readbackMismatches, processingMismatches |
            ConvertTo-Json
          "Receipt inspected for $env:RELEASE_RUN. No Store or GitHub write was attempted." >> $env:GITHUB_STEP_SUMMARY

  inspect:
    if: '!inputs.receipt_only'
    runs-on: windows-2025
    outputs:
      accepted: ${{ steps.status.outputs.accepted }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read the exact Store status
        id: status
        shell: pwsh
        env:
          STORE_TENANT_ID: ${{ secrets.STORE_TENANT_ID }}
          STORE_CLIENT_ID: ${{ secrets.STORE_CLIENT_ID }}
          STORE_CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
          SUBMISSION_ID: ${{ inputs.submission_id }}
        run: |
          Import-Module .\scripts\StoreRelease.psm1 -Force
          $status = Get-StoreReleaseStatus -SubmissionId $env:SUBMISSION_ID
          $status | ConvertTo-Json
          "accepted=$($status.accepted.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "Submission $($status.submissionId): $($status.status); accepted: $($status.accepted); published: $($status.published)." >> $env:GITHUB_STEP_SUMMARY
          if ($status.failed) { throw 'Store rejected the existing submission; no write was attempted.' }

  finish-github-release:
    needs: inspect
    if: inputs.release_run != '' && needs.inspect.outputs.accepted == 'true'
    runs-on: [self-hosted, Windows, X64, rodel-minecraftlauncher-build]
    concurrency:
      group: launcher-packaging
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resume only GitHub delivery for the exact existing run
        shell: pwsh
        env:
          STORE_TENANT_ID: ${{ secrets.STORE_TENANT_ID }}
          STORE_CLIENT_ID: ${{ secrets.STORE_CLIENT_ID }}
          STORE_CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
          GH_TOKEN: ${{ github.token }}
          SUBMISSION_ID: ${{ inputs.submission_id }}
          RELEASE_RUN: ${{ inputs.release_run }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_RUN -cnotmatch '^([1-9]\d*)-([1-9]\d*)$') { throw 'Supply the exact runId-attempt from the original release.' }
          $runId = $Matches[1]
          $attempt = $Matches[2]
          $root = Join-Path $env:RUNNER_WORKSPACE "launcher-store-releases\$env:RELEASE_RUN"
          $receipt = Get-Content "$root\store-receipt.json" -Raw | ConvertFrom-Json
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; 'X-GitHub-Api-Version' = '2022-11-28' }
          $run = Invoke-RestMethod -Uri "https://api.github.com/repos/Richasy/Rodel.MinecraftLauncher/actions/runs/$runId/attempts/$attempt" `
            -Headers $headers -MaximumRedirection 0
          if ($run.path -cne '.github/workflows/release-store.yml' -or $run.head_branch -cne 'main' -or
              $run.head_sha -cne $receipt.sourceCommit -or $receipt.submissionId -cne $env:SUBMISSION_ID) {
            throw 'The original workflow, source and exact Store draft must match the retained receipt.'
          }
          Import-Module .\scripts\StoreRelease.psm1 -Force
          $release = Complete-StoreGitHubRelease -ReceiptPath "$root\store-receipt.json" -NotesPath "$root\notes.json"
          "GitHub Release: $($release.url). No Store write was repeated." >> $env:GITHUB_STEP_SUMMARY
