name: Release Store update

on:
  workflow_dispatch:
    inputs:
      version:
        description: Four-part version; blank increments the highest published patch
        required: false
        default: ''
        type: string
      publish_store:
        description: Upload both architectures and commit for certification and automatic publication
        required: true
        default: false
        type: boolean
      generate_release_notes:
        description: Optional AI release notes; leave unchecked to preserve existing Store notes and update packages only
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: launcher-packaging
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: [self-hosted, Windows, X64, rodel-minecraftlauncher-build]
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    env:
      RODEL_MICROSOFT_CLIENT_ID: ${{ secrets.RODEL_MICROSOFT_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Freeze the published baseline and release source
        id: plan
        env:
          STORE_TENANT_ID: ${{ secrets.STORE_TENANT_ID }}
          STORE_CLIENT_ID: ${{ secrets.STORE_CLIENT_ID }}
          STORE_CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $id = [guid]::Empty
          if (-not [guid]::TryParse($env:RODEL_MICROSOFT_CLIENT_ID, [ref]$id) -or $id -eq [guid]::Empty) {
            throw 'Configure RODEL_MICROSOFT_CLIENT_ID before packaging.'
          }
          Import-Module .\scripts\StoreRelease.psm1 -Force
          $plan = Get-StoreReleasePlan -SourceRoot $env:GITHUB_WORKSPACE -Version $env:INPUT_VERSION
          $root = Join-Path $env:RUNNER_WORKSPACE "launcher-store-releases\$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)"
          if (Test-Path -LiteralPath $root) { throw 'This run already has durable release state; inspect it instead of replaying.' }
          $null = New-Item -ItemType Directory -Path $root
          $plan | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $root 'plan.json') -Encoding utf8NoBOM
          "RELEASE_ROOT=$root" >> $env:GITHUB_ENV
          "RELEASE_VERSION=$($plan.version)" >> $env:GITHUB_ENV
          "version=$($plan.version)" >> $env:GITHUB_OUTPUT
          "Release $($plan.version) from $($plan.sourceCommit); published baseline $($plan.publishedVersion)." >> $env:GITHUB_STEP_SUMMARY
      - name: Generate optional localized notes or preserve existing Store notes
        env:
          RELEASE_AI_ENABLED: ${{ vars.RELEASE_AI_ENABLED }}
          RELEASE_AI_ENDPOINT: ${{ vars.RELEASE_AI_ENDPOINT }}
          RELEASE_AI_MODEL: ${{ vars.RELEASE_AI_MODEL }}
          RELEASE_AI_API_KEY: ${{ secrets.RELEASE_AI_API_KEY }}
          GENERATE_RELEASE_NOTES: ${{ inputs.generate_release_notes }}
        run: |
          .\scripts\generate-store-notes.ps1 -PlanPath "$env:RELEASE_ROOT\plan.json" `
            -OutputPath "$env:RELEASE_ROOT\notes.json" -SkipReleaseNotes:($env:GENERATE_RELEASE_NOTES -ne 'true')
      - uses: actions/setup-dotnet@v5
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}\dotnet
        with:
          global-json-file: global.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Prepare isolated pinned ARM64 Rust
        run: |
          $env:CARGO_HOME = Join-Path $env:RUNNER_TOOL_CACHE 'rodel-cargo'
          $env:RUSTUP_HOME = Join-Path $env:RUNNER_TOOL_CACHE 'rodel-rustup'
          $rustup = Join-Path $env:CARGO_HOME 'bin\rustup.exe'
          if (-not (Test-Path -LiteralPath $rustup)) {
            $installer = Join-Path $env:RUNNER_TEMP 'rustup-init.exe'
            Invoke-WebRequest 'https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-pc-windows-msvc/rustup-init.exe' -OutFile $installer
            & $installer -y --no-modify-path --default-toolchain none --profile minimal
            if ($LASTEXITCODE -ne 0) { throw 'Isolated rustup installation failed.' }
          }
          & $rustup toolchain install 1.89.0 --profile minimal --target aarch64-pc-windows-msvc --no-self-update
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Rust installation failed.' }
          "CARGO_HOME=$env:CARGO_HOME" >> $env:GITHUB_ENV
          "RUSTUP_HOME=$env:RUSTUP_HOME" >> $env:GITHUB_ENV
          (Join-Path $env:CARGO_HOME 'bin') >> $env:GITHUB_PATH
      - name: Build and audit both unsigned Store uploads
        env:
          SPROUT_AZURE_READ_PAT: ${{ secrets.SPROUT_AZURE_READ_PAT }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SPROUT_AZURE_READ_PAT)) { throw 'Configure SPROUT_AZURE_READ_PAT.' }
          $env:NuGetPackageSourceCredentials_sprout = "Username=build;Password=$env:SPROUT_AZURE_READ_PAT;ValidAuthenticationTypes=Basic"
          [Environment]::SetEnvironmentVariable('ORG_GRADLE_PROJECT_org.gradle.java.installations.fromEnv', 'JAVA_HOME_8_X64,JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64')
          .\scripts\package-release.ps1 -Version $env:RELEASE_VERSION -Artifacts Store -Architectures x64,arm64 `
            -OutputDirectory "$env:RELEASE_ROOT\packages" -JavaHome $env:JAVA_HOME_25_X64 `
            -LegacyJavaHome $env:JAVA_HOME_21_X64 -ObservationJavaHome $env:JAVA_HOME_8_X64
      - name: Deliver directly to Store or validate without submission
        env:
          STORE_TENANT_ID: ${{ secrets.STORE_TENANT_ID }}
          STORE_CLIENT_ID: ${{ secrets.STORE_CLIENT_ID }}
          STORE_CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
          PUBLISH_STORE: ${{ inputs.publish_store }}
        run: |
          .\scripts\publish-store-update.ps1 -PlanPath "$env:RELEASE_ROOT\plan.json" `
            -PackageRoot "$env:RELEASE_ROOT\packages" -NotesPath "$env:RELEASE_ROOT\notes.json" `
            -ReceiptPath "$env:RELEASE_ROOT\store-receipt.json" -Submit:($env:PUBLISH_STORE -eq 'true')
      - name: Publish source-bound GitHub Release notes after Store acceptance
        if: inputs.publish_store
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Import-Module .\scripts\StoreRelease.psm1 -Force
          $release = Publish-StoreGitHubRelease -ReceiptPath "$env:RELEASE_ROOT\store-receipt.json" -NotesPath "$env:RELEASE_ROOT\notes.json"
          "GitHub Release: $($release.url)" >> $env:GITHUB_STEP_SUMMARY
      - name: Record actual delivery status
        if: always() && env.RELEASE_ROOT != ''
        run: |
          "Durable runner state: ``$env:RELEASE_ROOT``" >> $env:GITHUB_STEP_SUMMARY
          $path = Join-Path $env:RELEASE_ROOT 'store-receipt.json'
          if (Test-Path -LiteralPath $path) {
            $receipt = Get-Content $path -Raw | ConvertFrom-Json
            "Submission: $($receipt.submissionId); phase: $($receipt.phase); commit acknowledged: $($receipt.committed); status: $($receipt.status); published: $($receipt.published)." >> $env:GITHUB_STEP_SUMMARY
          }
          else { 'No Store submission was recorded.' >> $env:GITHUB_STEP_SUMMARY }
