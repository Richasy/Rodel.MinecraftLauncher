                                // Before 26.1 rules are stored in LevelSettings/level.dat, returned by native recreateWorldData.
                                text = text.replaceAll('(?s)\\s*var storedRules = LevelStorageSource\\.readExistingSavedData\\(.*?var gameRules = new GameRules\\([^;]+;', '')
                                    .replace('new PrimaryLevelData(recreated.getFirst(), dimensions.specialWorldProperty(),', 'new PrimaryLevelData(recreated.getFirst(), options, dimensions.specialWorldProperty(),')
