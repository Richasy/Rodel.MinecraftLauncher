                            if (source.name == 'MenuAdvancementTooltipMixin.java') text = text.replace('"renderHover"', '"drawHover"')
                            if (source.name == 'RealmsRowMetadataMixin.java') text = text.replace('"renderRealmStatus"', '"drawRealmStatus"')
                            if (source.name == 'SettingsFontMixin.java') text = text.replace('{"lambda$new$0", "getGlyph"}', '"getGlyph"')
                            if (source.name == 'ModernScrollbarMixin.java') text = text.replace('@Shadow public abstract int scrollbarWidth();',
                                'public int scrollbarWidth() { return AbstractScrollArea.SCROLLBAR_WIDTH; }')
                            if (source.name == 'WorldWaitingMixin.java') text = text.replace('@Shadow @Final private boolean showLoadingDots;', '')
                                .replace('List.of(messageText)', 'messageText == null ? List.of() : List.of(messageText)')
                                .replace('showLoadingDots ?', 'messageText == null ?')
                            if (source.name == 'WorldBranchScreensMixin.java') text = text.replace('@Mixin(', '@org.spongepowered.asm.mixin.Pseudo\n@Mixin(')
