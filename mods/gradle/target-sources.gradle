                                    .replace('registries.compositeAccess().allRegistriesLifecycle());', 'registries.compositeAccess().allRegistriesLifecycle());\n                data.setDifficultyLocked(pending.previousServer.getWorldData().isDifficultyLocked());')
                                    .replaceAll('(?s)\\s*var settings = new LevelDataAndDimensions\\.WorldDataAndGenSettings\\(data,.*?new WorldGenSettings\\(options, context.selectedDimensions\\(\\)\\)\\);', '')
