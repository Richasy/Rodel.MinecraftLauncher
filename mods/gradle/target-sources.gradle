                            }
                            text = text.replace('MenuTabBar$MenuTabButton', 'TabButton')
                                .replace('MenuTabBar', 'TabNavigationBar')
                                .replace('net.minecraft.client.gui.components.tabs.TabButton', 'net.minecraft.client.gui.components.TabButton')
                                .replace('class TabNavigationBarMixin', 'class MenuTabBarMixin')
                                .replace('.gui.screen()', '.screen')
                                .replace('.gui.setScreen(', '.setScreen(')
                                .replace('.gui.overlay()', '.getOverlay()')
                                .replace('.gui.toastManager()', '.getToastManager()')
                                .replace('.gui.hud.getChat()', '.gui.getChat()')
                                .replace('.gui.hud.getGuiTicks()', '.gui.getGuiTicks()')
                                .replace('.gui.hud.extractDeferredSubtitles()', '.gui.extractDeferredSubtitles()')
                                .replace('.gui.hud.isHidden()', '.options.hideGui')
                                .replace('m.gui.hud.toggle()', 'm.options.hideGui = !m.options.hideGui')
                                .replace('net.minecraft.server.MinecraftServer.MultiplayerScope.LAN, 0', 'null, false, 0')
                                .replace(', ScrollableLayout.ReserveStrategy.RIGHT', '')
                                .replace('OptionInstance.NO_ACTION', 'value -> {}')
                            text = text.replaceAll('([A-Za-z][A-Za-z0-9]*)\\.removeChildren\\(\\)',
                                'io.github.richasy.rodel.ui.menus.LayoutCompatibility.clear($1)')
                                .replaceAll('([A-Za-z][A-Za-z0-9]*)\\.setScrollbarSpacing\\(',
                                    '((io.github.richasy.rodel.ui.mixin.compat.LegacyLayoutAccess.Scroll) $1).rodel\\$spacing(')
                                .replace('bar.setRectangle(', 'io.github.richasy.rodel.ui.menus.LayoutCompatibility.tabs(bar, ')
                                .replace('tabs.setRectangle(', 'io.github.richasy.rodel.ui.menus.LayoutCompatibility.tabs(tabs, ')
                                .replace('bar.getX()', 'bar.getRectangle().left()').replace('bar.getY()', 'bar.getRectangle().top()')
                                .replace('tabs.getX()', 'tabs.getRectangle().left()').replace('tabs.getY()', 'tabs.getRectangle().top()')
                                .replace('.rodel$tabs().getX()', '.rodel$tabs().getRectangle().left()')
                                .replace('current.getLayout()', '((io.github.richasy.rodel.ui.mixin.compat.LegacyLayoutAccess.Tab) current).rodel$layout()')
                                .replace('tab.getLayout()', '((io.github.richasy.rodel.ui.mixin.compat.LegacyLayoutAccess.Tab) tab).rodel$layout()')
                                .replace('@Override public void removeChildren()', 'public void removeChildren()')
                                .replace('@Override\n        public void removeChildren()', 'public void removeChildren()')
                                .replace('@Override\r\n        public void removeChildren()', 'public void removeChildren()')
                            if (source.name in ['MenuTabBarMixin.java', 'WorldTabBarMixin.java']) text = text.replace('"extractWidgetRenderState"', '"extractRenderState"')
                            if (source.name == 'AdvancementsMenuPage.java') text = text.replace(
                                'selected.extractTooltips(graphics, treeX() - 9, treeY() - 18)',
                                'selected.extractTooltips(graphics, (int) coordinate(Minecraft.getInstance().mouseHandler.getScaledXPos(Minecraft.getInstance().getWindow())) - treeX(), (int) coordinate(Minecraft.getInstance().mouseHandler.getScaledYPos(Minecraft.getInstance().getWindow())) - treeY(), treeX() - 9, treeY() - 18)')
                            if (source.name == 'WorldPage.java') text = text.replace('widgets.add(((WorldCreateAccess) screen).rodel$tabs());',
                                '((WorldCreateAccess) screen).rodel$tabs().children().forEach(child -> widgets.add((AbstractWidget) child));')
                            if (source.name in ['PauseMenuAccess.java', 'MenuPauseMixin.java']) {
                                text = text.replace('import net.minecraft.client.gui.components.FriendsButton;', '')
                                    .replace('FriendsButton rodel$friendsButton()', 'Button rodel$friendsButton()')
                                    .replace('@Override @Accessor("friends") public abstract Button rodel$friendsButton();',
                                        '@Override public Button rodel$friendsButton() { return null; }')
                            }
                            if (source.name == 'NetworkRowLayout.java') {
                                text = text.replace('import net.minecraft.client.gui.components.PlayerFaceWidget;', '')
                                    .replace('child instanceof PlayerFaceWidget', 'child.getClass().getName().equals("net.minecraft.client.gui.components.PlayerFaceWidget")')
                            }
                            if (source.name == 'NativeUiTransitionMixin.java') {
                                text = text.replace('@Mixin(Gui.class)', '@Mixin(net.minecraft.client.Minecraft.class)')
                                    .replace('@Shadow public abstract Screen screen();', '@Shadow public Screen screen;')
                                    .replace('Screen previous = screen();', 'Screen previous = screen;')
                            }
                            if (source.name in ['MenuBackgroundMixin.java', 'MenuTabMixin.java', 'OnlineRowSurfaceMixin.java'])
                                text = text.replace('@Mixin(', '@org.spongepowered.asm.mixin.Pseudo\n@Mixin(')
                            if (source.name == 'ModBrowserScreenMixin.java') text = text.replace('@Mixin(Gui.class)', '@Mixin(net.minecraft.client.Minecraft.class)')
                            if (source.name == 'MenuSpriteButtonMixin.java') text = text.replace('@Shadow private boolean loading;', '').replace('return loading;', 'return false;')
                            if (source.name == 'WorldTabButtonMixin.java') {
                                text = text.replace('extends TabButton', 'extends net.minecraft.client.gui.components.AbstractWidget')
                                    .replace('protected WorldTabButtonMixin(TabManager manager, Tab tab, int width, int height) { super(manager, tab, width, height); }',
                                        'protected WorldTabButtonMixin(int x, int y, int width, int height, net.minecraft.network.chat.Component title) { super(x, y, width, height, title); }\n    @org.spongepowered.asm.mixin.Shadow public abstract boolean isSelected();')
                            }
                            if (source.name != 'LayoutCompatibility.java') ['scroll', 'viewport', 'scrolling'].each { variable ->
                                text = text.replace("${variable}.arrangeElements()", "io.github.richasy.rodel.ui.menus.LayoutCompatibility.arrange(${variable})")
                            }
                            if (source.name == 'WorldTabManagerMixin.java') text = text.replace('Tab;ZZ)V', 'Tab;Z)V').replace('boolean sound, boolean addWidgets,', 'boolean sound,')
                            if (source.name == 'MenuAdvancementTabMixin.java') text = text.replace('"tick", ', '')
                            if (source.name == 'MenuAdvancementsMixin.java') {
                                text = text.replace('@Shadow private int leftPos;', '@org.spongepowered.asm.mixin.Unique private int leftPos;')
                                    .replace('@Shadow private int topPos;', '@org.spongepowered.asm.mixin.Unique private int topPos;')
                                    .replace('rodel$empty(GuiGraphicsExtractor graphics, CallbackInfo', 'rodel$empty(GuiGraphicsExtractor graphics, int x, int y, CallbackInfo')
                                    .replace('rodel$noVanillaFrame(GuiGraphicsExtractor graphics, int x, int y, CallbackInfo', 'rodel$noVanillaFrame(GuiGraphicsExtractor graphics, int x, int y, int mouseX, int mouseY, CallbackInfo')
                                    .replace('rodel$tooltips(GuiGraphicsExtractor graphics, int x, int y, CallbackInfo', 'rodel$tooltips(GuiGraphicsExtractor graphics, int x, int y, int mouseX, int mouseY, CallbackInfo')
                                    .replaceAll('(?s)\\s*@WrapOperation\\(method = "tick".*?\\n    \\}', '')
                            }
                        }
                        if (gameTarget == '1.21.11') {
                            if (source.name in ['GuiPreeditAccessor.java', 'TextInputGeometryMixin.java',
                                'OnlineWorldOptionsLayoutMixin.java', 'WorldBranchProgressMixin.java',
                                'OnlineInWorldRulesLayoutMixin.java', 'WorldBranchProgressHost.java', 'WorldBranchProgressWidget.java']) {
                                source.delete()
                                return
                            }
                            text = text.replace('GuiGraphicsExtractor', 'GuiGraphics')
                                .replace('Screens.getWidgets(', 'Screens.getButtons(')
                                .replace('net.minecraft.client.renderer.state.gui.GuiTextRenderState', 'net.minecraft.client.gui.render.state.GuiTextRenderState')
                                .replace('WorldCreationGameRulesScreen', 'EditGameRulesScreen')
                                .replace('AbstractGameRulesScreen', 'EditGameRulesScreen')
                                .replace('net.minecraft.client.gui.screens.options.InWorldGameRulesScreen', 'net.minecraft.client.gui.screens.worldselection.EditGameRulesScreen')
                                .replace('InWorldGameRulesScreen', 'EditGameRulesScreen')
                                .replace('PlayerFaceExtractor', 'PlayerFaceRenderer')
                                .replace('getTotalProgress()', 'getProgress()')
                                .replace('bar.updateWidth(width)', 'bar.setWidth(width)')
                                .replace('ClientCommands', 'ClientCommandManager')
                                .replace('net.minecraft.client.multiplayer.chat.GuiMessage;', 'net.minecraft.client.GuiMessage;')
                                .replace('import net.minecraft.client.multiplayer.chat.GuiMessageSource;', '')
                                .replace('message.source() == GuiMessageSource.SYSTEM_CLIENT && ', '')
                                .replace('message.signature(), message.source(), message.tag()', 'message.signature(), message.tag()')
                                .replace('addClientSystemMessage(', 'addMessage(')
                                .replace('.getWorldGenSettings().options()', '.getWorldData().worldGenOptions()')
                                .replace('client.player.sendSystemMessage(', 'client.gui.getChat().addMessage(')
                                .replace('server.getGameRules()', 'server.getWorldData().getGameRules()')
                                .replace('.resizeGui()', '.resizeDisplay()')
                                .replace('.value().assemble(CraftingInput.of(1, 1, List.of(new ItemStack(Items.STICK))))',
                                    '.value().assemble(CraftingInput.of(1, 1, List.of(new ItemStack(Items.STICK))), server.registryAccess())')
                                .replace('extractRenderStateWithTooltipAndSubtitles', 'renderWithTooltipAndSubtitles')
                                .replace('extractWidgetRenderState', 'renderWidget')
                                .replace('extractRenderState', 'render')
                            ['Background', 'BlurredBackground', 'Border', 'Content', 'Contents', 'DeferredElements',
                                'DeferredSubtitles', 'Hover', 'Inside', 'ListBackground', 'ListSeparators', 'MenuBackground',
                                'Panorama', 'PlayerFace', 'RealmStatus', 'Scrollbar', 'Selection', 'Text', 'Toast',
                                'TooltipForNextRenderPass', 'Tooltips', 'TransparentBackground', 'Window',
                                'AirBubbles', 'Armor', 'ButtonArrows', 'Buttons', 'DefaultSprite', 'ExperienceLevel',
                                'Food', 'Hearts', 'ItemHotbar', 'Labels', 'Page', 'Scroller', 'Slot',
                                'SlotHighlightBack', 'SlotHighlightFront', 'TabButton', 'TextLines', 'TooltipBackground',
                                'VehicleHealth'].each { suffix ->
                                text = text.replace("extract${suffix}", "render${suffix}")
                            }
                            text = text.replace('graphics.text(', 'graphics.drawString(')
                                .replace('g.text(', 'g.drawString(')
                                .replace('g.centeredText(', 'g.drawCenteredString(')
                                .replace('g.outline(', 'g.renderOutline(')
                                .replace('g.fakeItem(', 'g.renderFakeItem(')
                                .replace('graphics.centeredText(', 'graphics.drawCenteredString(')
                                .replace('graphics.outline(', 'graphics.renderOutline(')
                                .replace('GuiGraphics;text(', 'GuiGraphics;drawString(')
                                .replace('GuiGraphics;centeredText(', 'GuiGraphics;drawCenteredString(')
                                .replace('GuiGraphics;outline(', 'GuiGraphics;renderOutline(')
                                .replace('graphics.horizontalLine(', 'graphics.hLine(')
                                .replace('renderTooltips(', 'drawTooltips(')
                                .replace('"renderTooltips"', '"drawTooltips"')
                                .replace('selected.renderContents(', 'selected.drawContents(')
                                .replace('PlayerFaceRenderer.render(', 'PlayerFaceRenderer.draw(')
                                .replace('super.scrollbarWidth()', 'net.minecraft.client.gui.components.AbstractScrollArea.SCROLLBAR_WIDTH')
                                .replace('area.scrollbarWidth()', 'AbstractScrollArea.SCROLLBAR_WIDTH')
                                .replace('packList.scrollbarWidth()', 'net.minecraft.client.gui.components.AbstractScrollArea.SCROLLBAR_WIDTH')
                                .replace(', defaultSettings(18)', '')
                                .replace('take(remaining, window, options.exclusiveFullscreen());', '')
                                .replace('graphics.renderDeferredElements(x, y, partialTick)', 'graphics.renderDeferredElements()')
                                .replace('renderDeferredElements(IIF)V', 'renderDeferredElements()V')
                                .replace('graphics.setPreeditOverlay(null);', '')
                                .replace('import net.minecraft.client.input.PreeditEvent;', '')
                                .replace('import net.minecraft.client.gui.components.IMEPreeditOverlay;', '')
                                .replace('@Shadow private IMEPreeditOverlay preeditOverlay;', '')
                                .replace(' || preeditOverlay != null', '')
                                .replaceAll('(?m)^\\s*@Override\\s+public boolean preeditUpdated\\(PreeditEvent event\\) \\{[^\\n]*\\}\\r?\\n', '\n')
                                .replaceAll('(?m)^\\s*UiInputGeometry\\.flushPreedit\\([^\\n]+\\);\\r?\\n', '\n')
                                .replaceAll('(?m)^\\s*if \\(widget instanceof WorldBranchProgressWidget\\) return widget\\.getHeight\\(\\) \\+ 12;\\r?\\n', '\n')
                                .replaceAll('(?s)\\s*if \\(widget instanceof WorldBranchProgressWidget\\) \\{.*?\\n            \\}', '')
                                .replaceAll('(?m)^\\s*if \\(screen instanceof WorldBranchProgressHost progress\\)\\r?\\n\\s*paragraphs\\.add\\([^\\n]+\\);\\r?\\n', '\n')
                                .replaceAll('(?m)^\\s*(scroll|scrolling|viewport)\\.setMinHeight\\([^;]+\\);\\r?\\n', '\n')
                                .replaceAll('@Override\\s+(public int scrollbarWidth\\(\\))', '$1')
                                .replaceAll('(?m)^\\s*\\(\\(io\\.github\\.richasy\\.rodel\\.ui\\.mixin\\.compat\\.LegacyLayoutAccess\\.Scroll\\)[^\\n]+\\.rodel\\$spacing\\([^;]+\\);\\r?\\n', '\n')
                            if (source.name == 'LegacyLayoutAccess.java') text = text.replaceAll('(?s)\\s*@Mixin\\(ScrollableLayout.class\\) public interface Scroll \\{.*?\\n    \\}', '')
