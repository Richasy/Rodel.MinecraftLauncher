// Only audited API differences belong here; business logic stays in the shared Java sources.
def nativeUiModule = project.name == 'rodel-ui'
if (minecraft_version in ['26.2', '26.1.2', '1.21.11']) {
    def gameTarget = minecraft_version
    sourceSets.each { sourceSet ->
        def originalDirectories = sourceSet.java.srcDirs.toList()
        def generatedDirectory = layout.buildDirectory.dir("generated/game-target/${sourceSet.name}").get().asFile
        def overrides = file("src/targets/${minecraft_version}/${sourceSet.name}/java")
        def sharedOverrides = file("src/targets/26.2/${sourceSet.name}/java")
        def layoutOverrides = gameTarget == '1.21.11' ? file("src/targets/26.1.2/${sourceSet.name}/java") : overrides
        def prepare = tasks.register("prepare${sourceSet.name.capitalize()}TargetSources", Sync) {
            from(originalDirectories)
            into(generatedDirectory)
            inputs.property('minecraftTarget', minecraft_version)
            inputs.files(fileTree(overrides))
            inputs.files(fileTree(sharedOverrides))
            inputs.files(fileTree(layoutOverrides))
            doLast {
                [sharedOverrides, layoutOverrides, overrides].each { directory ->
                    if (directory.isDirectory()) directory.eachFileRecurse { input ->
                        if (input.isFile()) {
                            def target = new File(generatedDirectory, directory.toPath().relativize(input.toPath()).toString())
                            target.parentFile.mkdirs()
                            target.bytes = input.bytes
                        }
                    }
                }
                generatedDirectory.eachFileRecurse { source ->
                    if (source.isFile() && source.name.endsWith('.java')) {
                        def override = new File(overrides, generatedDirectory.toPath().relativize(source.toPath()).toString())
                        if (!override.isFile()) override = new File(layoutOverrides, generatedDirectory.toPath().relativize(source.toPath()).toString())
                        if (!override.isFile()) override = new File(sharedOverrides, generatedDirectory.toPath().relativize(source.toPath()).toString())
                        def text = (override.isFile() ? override : source).getText('UTF-8')
                        text = text.replace('com.mojang.renderpearl.api.', 'com.mojang.blaze3d.')
                            .replace('com/mojang/renderpearl/api/', 'com/mojang/blaze3d/')
                            .replace('net.minecraft.client.gui.screens.WorldOptionsScreen', 'net.minecraft.client.gui.screens.options.WorldOptionsScreen')
                            .replace('GAME + "WorldOptionsScreen"', '"net.minecraft.client.gui.screens.options.WorldOptionsScreen"')
                            .replace('InputConstants.isKeyDown(', 'InputConstants.isKeyDown(net.minecraft.client.Minecraft.getInstance().getWindow(), ')
                            .replace('tab.getRootAdvancement()', 'tab.getRootNode().holder()')
                        if (source.name == 'NativeTextBox.java') {
                            text = text.replaceAll('(?m)^\\s*@Override\\r?\\n\\s*public boolean capturesInput\\(\\) \\{ return editor\\.capturesInput\\(\\); \\}\\r?\\n', '\n')
                        }
                        if (source.name == 'CreationGameTest.java') text = text.replace('startsForStructure(feet.getX() >> 4, feet.getZ() >> 4,',
                            'startsForStructure(new net.minecraft.world.level.ChunkPos(feet.getX() >> 4, feet.getZ() >> 4),')
                        if (source.name == 'NativeComposer.java') {
                            text = text.replaceAll('(?m)^\\s*@Override public boolean capturesInput\\(\\) \\{ return active && editor\\.capturesInput\\(\\); \\}\\r?\\n', '\n')
                        }
                        if (source.name == 'OnlineBrowserLayoutMixin.java') text = text.replace('joinButton', 'selectButton')
                        if (source.name == 'NativeMenus.java') text = text.replace('"WorldOptionsScreen"', '"options.WorldOptionsScreen"')
                        if (source.name == 'MenuAdvancementsMixin.java') {
                            text = text.replace('"onAdvancementsUpdated"', '"onAddAdvancementRoot", "onRemoveAdvancementRoot", "onAdvancementsCleared"')
                        }
                        if (source.name in ['OnlineFriendsTabLayoutMixin.java', 'OnlinePendingTabLayoutMixin.java']) {
                            text = text.replace('@Shadow private FrameLayout contentFrame;', '')
                                .replace('return contentFrame;', 'return null;')
                        }
                        if (source.name == 'OptionsHeaderSettingsMixin.java') text = text.replace('FocusableTextWidget', 'StringWidget')
                        if (source.name == 'FolderOpenMixin.java') {
                            text = text.replace('@Mixin(Blaze3D.class)', '@Mixin(Util.OS.class)')
                                .replace('method = "openUri"', 'method = "openUri(Ljava/net/URI;)V"')
                                .replace('private static void rodel$openDirectory', 'private void rodel$openDirectory')
                        }
                        if (source.name == 'WorldRuleCategoryMixin.java') {
                            text = text.replace('@Shadow @Final private FocusableTextWidget widget;', '@Shadow @Final private Component label;')
                                .replace('(Object) this, widget)', '(Object) this, label)')
                                .replace('widget.getMessage().getString()', 'this.label.getString()')
                        }
                        // These multi-target groups also name screens/inner lists introduced after 26.2.
                        // Keep every existing target and its normal injection checks; only absent optional targets are soft.
                        if (source.name in ['RealmsMenuListMixin.java', 'RealmsMenuLayoutMixin.java']) {
                            text = text.replace('@Mixin(', '@org.spongepowered.asm.mixin.Pseudo\n@Mixin(')
                        }
                        if (gameTarget in ['26.1.2', '1.21.11']) {
