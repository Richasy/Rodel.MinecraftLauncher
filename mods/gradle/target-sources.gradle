                            text = text.replace('net.minecraft.client.gui.Hud', 'net.minecraft.client.gui.Gui')
                                .replace('@Mixin(Hud.class)', '@Mixin(Gui.class)')
                                .replace('net.minecraft.client.gui.contextualbar.ContextualBar;', 'net.minecraft.client.gui.contextualbar.ContextualBarRenderer;')
                                .replace('@Mixin(ContextualBar.class)', '@Mixin(ContextualBarRenderer.class)')
                            if (source.name in ['FriendsWarningBackgroundMixin.java', 'MenuFriendCountMixin.java',
                                'OnlineFriendsLayoutMixin.java', 'OnlineFriendsDynamicLayoutMixin.java',
                                'OnlineFriendsTabLayoutMixin.java', 'OnlinePendingTabLayoutMixin.java', 'OnlineFriendRowMixin.java']) {
                                source.delete()
