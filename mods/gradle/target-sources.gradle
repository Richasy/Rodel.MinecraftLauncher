                                }
                            }
                        }
                        source.setText(text, 'UTF-8')
                    }
                }
            }
        }
        sourceSet.java.setSrcDirs([generatedDirectory])
        tasks.named(sourceSet.compileJavaTaskName) { dependsOn(prepare) }
        tasks.matching { it.name == 'sourcesJar' }.configureEach { dependsOn(prepare) }
    }
    if (minecraft_version in ['26.1.2', '1.21.11'] && project.name == 'rodel-ui') {
        def unavailable = ['FriendsWarningBackgroundMixin', 'MenuFriendCountMixin', 'OnlineFriendsLayoutMixin',
            'OnlineFriendsDynamicLayoutMixin', 'OnlineFriendsTabLayoutMixin', 'OnlinePendingTabLayoutMixin', 'OnlineFriendRowMixin']
        if (gameTarget == '1.21.11') unavailable.addAll(['GuiPreeditAccessor', 'TextInputGeometryMixin', 'OnlineWorldOptionsLayoutMixin', 'OnlineInWorldRulesLayoutMixin', 'WorldBranchProgressMixin'])
        tasks.named('processResources') {
            inputs.property('unavailableNativeFriends', unavailable)
            doLast {
                def config = destinationDir.toPath().resolve('rodel-game-ui.mixins.json').toFile()
                def data = new groovy.json.JsonSlurper().parse(config)
                data.client.removeAll(unavailable)
                data.client.addAll(['compat.LegacyLayoutAccess$Grid', 'compat.LegacyLayoutAccess$Linear',
                    'compat.LegacyLayoutAccess$Frame', 'compat.LegacyLayoutAccess$Bar',
                    'compat.LegacyLayoutAccess$Tab', 'compat.LegacyLayoutAccess$Scroll', 'compat.LegacyLayoutAccess$Container'])
                if (gameTarget == '1.21.11') data.client.remove('compat.LegacyLayoutAccess$Scroll')
                config.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(data)), 'UTF-8')
            }
        }
    }
}

if (minecraft_version == '1.21.11' && project.name == 'rodel-ui') afterEvaluate {
    // Derive this version's small GUI-name lookup from Loom's actual compilation mappings, never a runtime file.
    def mappings = loom.mappingConfiguration.getMappingsServiceOptions(project).get().mappings.get().asFile
    def output = layout.buildDirectory.file('generated/game-target/main/io/github/richasy/rodel/ui/platform/LegacyUiNames.java').get().asFile
    tasks.named('prepareMainTargetSources') {
        inputs.file(mappings)
        doLast {
            def entries = []
            mappings.eachLine('UTF-8') { line ->
                def columns = line.split('\t')
                if (columns.length == 4 && columns[0] == 'c' &&
                    (columns[3].startsWith('net/minecraft/client/gui/') || columns[3].startsWith('com/mojang/realmsclient/'))) {
                    entries.add('        Map.<String,String>entry("' + columns[2].replace('/', '.') + '", "' + columns[3].replace('/', '.') + '")')
                }
            }
            if (entries.isEmpty()) throw new GradleException('Missing legacy UI class mappings')
            output.parentFile.mkdirs()
            // Keep the large literal fully typed; cross-entry inference otherwise dominates legacy compilation.
            output.setText('''package io.github.richasy.rodel.ui.platform;
import java.util.Map;
/** Canonical native GUI names for the obfuscated 1.21.11 runtime; unknown/mod classes remain unchanged. */
public final class LegacyUiNames {
    private static final Map<String,String> NAMES = Map.<String,String>ofEntries(
''' + entries.join(',\n') + ''');
    private LegacyUiNames() { }
    /** Resolves only mapped native GUI classes, preserving exact third-party ownership boundaries. */
    public static String name(Class<?> type) { return NAMES.getOrDefault(type.getName(),type.getName()); }
    /** Retains the native simple-name classifications used by existing page layouts. */
    public static String simpleName(Class<?> type) {
        String name=NAMES.get(type.getName());
        return name==null?type.getSimpleName():name.substring(Math.max(name.lastIndexOf('.'),name.lastIndexOf('$'))+1);
    }
}
''', 'UTF-8')
        }
    }
}

def mixinJava = "JAVA_${java_version}".toString()
tasks.named('processResources') {
    inputs.property('mixinJava', mixinJava)
    filesMatching('*mixins.json') { filter { line -> line.replace('JAVA_25', mixinJava) } }
}
