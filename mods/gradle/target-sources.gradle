                                    text = text.replaceAll('([A-Za-z_][A-Za-z0-9_]*(?:\\.[A-Za-z_][A-Za-z0-9_]*\\(\\))?)\\.getClass\\(\\)\\.get' + suffix + '\\(\\)',
