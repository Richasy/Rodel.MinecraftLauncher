plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
}

apply from: '../gradle/game-target.gradle'
apply plugin: legacy_minecraft ? 'net.fabricmc.fabric-loom-remap' : 'net.fabricmc.fabric-loom'

loom {
    accessWidenerPath = target_access_widener
    splitEnvironmentSourceSets()
    mods {
        worldreroll {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}
loom.runConfigs.named('client') { runDirectory = file('run/client') }
loom.runConfigs.named('server') { runDirectory = file('run/server') }

repositories { maven { url = 'https://maven.terraformersmc.com/releases/' } }

dependencies {
    add(legacy_minecraft ? 'modCompileOnly' : 'compileOnly', "com.terraformersmc:modmenu:${modmenu_version}")
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    if (legacy_minecraft) mappings loom.officialMojangMappings()
    add(legacy_minecraft ? 'modImplementation' : 'implementation', "net.fabricmc:fabric-loader:${project.loader_version}")
    add(legacy_minecraft ? 'modImplementation' : 'implementation', "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}")
    testImplementation platform('org.junit:junit-bom:6.0.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test { useJUnitPlatform() }
if (client_tests_supported) fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'worldreroll_test'
        enableGameTests = false
        enableClientGameTests = true
        clearRunDirectory = false
    }
}
if (client_tests_supported && legacy_minecraft) dependencies {
    gametestImplementation files("../bettertools/build/targets/${minecraft_version}/devlibs/bettertools-${version}-dev.jar")
        .builtBy(gradle.includedBuild('bettertools').task(':jar'))
    // A named development client consumes the composite builds' named artifacts directly.
    // Remapping their published jars during configuration can retain the previous build's bytes.
    gametestImplementation files("../rodel-ai/build/targets/${minecraft_version}/devlibs/rodel-ai-${version}-dev.jar")
        .builtBy(gradle.includedBuild('rodel-ai').task(':jar'))
}
if (client_tests_supported && !legacy_minecraft) dependencies {
    gametestImplementation "io.github.richasy.rodel:rodel-ai:${project.version}"
    gametestImplementation "io.github.richasy.rodel:bettertools:${project.version}"
}
if (client_tests_supported) tasks.named('runClientGameTest') {
    // A failed isolated client must exit, rather than leave Fabric's error dialog blocking the test job.
    jvmArgs '-Dfabric.noGui=true'
    // Legacy Fabric's packet synchronizer cannot track the native LAN lifecycle exercised by RerollGameTest.
    // These tests already wait for actual server/player/screen state at each transition.
    if (legacy_minecraft) jvmArgs '-Dfabric.client.gametest.disableNetworkSynchronizer=true'
}
if (client_tests_supported) loom.runConfigs.named('clientGameTest') {
    runDirectory = layout.buildDirectory.dir('run/clientGameTest').get().asFile
}
def resourceTokens = [version: project.version.toString(), minecraft_version: project.minecraft_version, java_version: project.java_version]
processResources {
    inputs.properties(resourceTokens)
    filesMatching('fabric.mod.json') { expand(resourceTokens) }
    if (legacy_minecraft) filesMatching('*.accesswidener') { filter { line -> line.replace('accessWidener v2 official', 'accessWidener v2 named') } }
}
tasks.withType(JavaCompile).configureEach {
    options.release = Integer.parseInt(bytecode_version)
    options.encoding = 'UTF-8'
}
java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
    withSourcesJar()
}
jar { from('LICENSE') }
apply from: '../gradle/target-sources.gradle'
